name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod
      apply_infra:
        description: "Run terraform apply"
        required: true
        default: true
        type: boolean
      deploy_app:
        description: "Deploy API artifact"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OrderClassification.sln

      - name: Build
        run: dotnet build OrderClassification.sln --no-restore -c Release

      - name: Test
        run: dotnet test OrderClassification.sln --no-build -c Release

      - name: Publish API
        run: dotnet publish ./OrderClassification.Api/OrderClassification.Api.csproj -c Release -o ./artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: orderclassification-api
          path: artifacts/api

  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-package
    if: ${{ github.event.inputs.apply_infra == 'true' }}
    environment: ${{ github.event.inputs.environment }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan -var="environment=${{ github.event.inputs.environment }}"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan

  deploy-app:
    runs-on: ubuntu-latest
    needs:
      - build-package
      - deploy-infra
    if: ${{ always() && github.event.inputs.deploy_app == 'true' && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') }}
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: orderclassification-api
          path: artifacts/api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-oc${{ github.event.inputs.environment }}
          package: artifacts/api


