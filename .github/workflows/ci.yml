name: ci

"on":
  push:
    branches: ["feature/dotnet10-cram", "main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OrderClassification.sln

      - name: Build
        run: dotnet build OrderClassification.sln --no-restore -c Release

      - name: Test
        run: dotnet test OrderClassification.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

